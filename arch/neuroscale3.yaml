# NeuroScale arch from Yale
architecture:
  name: neuroscale_chip
  attributes:
    topology: mesh
    width: 4
    height: 4
    link_buffer_size: 16
    sync_model: fixed
    # latency_sync: 2.6e-05
    # latency_sync: 1.4e-5  # stale: calibrated against an older design
    # Measured on an idle chip (no input axons yet): a step takes 1.77 us, which is
    #  this sync cost plus 50 neurons x 7.6 ns of neuron updates
    latency_sync: 1.39e-6
    # latency_sync: 0.0
    sync_protocol: neuroscale
    max_steps_async: 6  # TIME_ADVANCE: 7, TIME_HISTORY: 8
  tile:
    - name: neuroscale_tile[0..15]
      attributes:
        energy_north_hop: 1.2e-05
        latency_north_hop: 0.0e-10
        # latency_north_hop: 5.0e-10
        # latency_north_hop: 2.0e-8
        energy_east_hop: 1.2e-05
        latency_east_hop: 0.0e-10
        # latency_east_hop: 5.0e-10
        # latency_east_hop: 2.0e-8
        energy_south_hop: 1.2e-05
        latency_south_hop: 0.0e-10
        # latency_south_hop: 5.0e-10
        # latency_south_hop: 2.0e-8
        energy_west_hop: 1.2e-05
        latency_west_hop: 0.0e-10
        # latency_west_hop: 5.0e-10
        # latency_west_hop: 2.0e-8
      core:
        - name: neuroscale_core[0..3]
          attributes:
            buffer_position: synapse
            buffer_inside_unit: false
            # The RTL core holds 1024 neurons (NEURONS_PER_CORE in parameters.act)
            max_neurons_supported: 1024
          axon_in:
            - name: neuroscale_in
              attributes:
                energy_message_in: 1.1e-07
                # Per spiking axon, from the axon microbenchmark (bmarks/axon_micro): the
                #  cost a spike adds beyond its synapses, 15.21 ns. This is the input unit's
                #  handling of the arriving spike (about 11.2 ns) plus the accumulate step's
                #  synapse-list header read for that axon (about 2.2 ns) and a remainder
                #  not yet attributed. The header read is charged here with the arrival.
                latency_message_in: 1.521e-08
          soma:
            - name: neuroscale_lif
              attributes:
                model: neuroscale
                energy_access_neuron: 4.5e-10
                latency_access_neuron: 7.6e-9
                energy_update_neuron: 0.0
                latency_update_neuron: 0.0
                energy_spike_out: 7.0e-10
                latency_spike_out: 0.0e-9
            # RTL-exact neuron (neuron_models/lif and rw_*): refractory period,
            #  probabilistic firing from a per-core LFSR, decay bit, optional floor at
            #  zero. Latencies are copied from neuroscale_lif and have not been
            #  calibrated separately for the random-walker chips.
            - name: neuroscale_plif
              attributes:
                model: neuroscale_plif
                energy_access_neuron: 4.5e-10
                latency_access_neuron: 7.6e-9
                energy_update_neuron: 0.0
                latency_update_neuron: 0.0
                energy_spike_out: 7.0e-10
                latency_spike_out: 0.0e-9
            - name: neuroscale_inputs[0..1023]
              attributes:
                model: input
                energy_access_neuron: 0.0
                latency_access_neuron: 0.0
                energy_update_neuron: 0.0
                latency_update_neuron: 0.0
                energy_spike_out: 0.0
                latency_spike_out: 0.0
          dendrite:
            - name: neuroscale_dendrites
              attributes:
                model: accumulator
                energy_update: 0.0
                latency_update: 0.0
            # - name: neuroscale_dendrites_delay
            #   attributes:
            #     model: accumulator_with_delay
            #     energy_update: 0.0
            #     latency_update: 0.0
          synapse:
            - name: neuroscale_synapses
              attributes:
                model: neuroscale_synapse
                energy_read_synapse: 1.2e-09
                energy_scan_axon: 0.0e-9
                # Per synapse event, from the axon microbenchmark: 4.72 ns (also the exact
                #  fit to the RTL's accumulate step).
                latency_read_synapse: 4.72e-09
                # Per axon per step, whether or not it spiked, from the axon microbenchmark:
                #  8.61 ns. The RTL scans every used axon twice (4.41 ns in the accumulate
                #  step plus 4.23 ns in the learning step), so a single-loop value of ~3.8 ns
                #  is too low. The scan only starts once a core has seen its first spike.
                latency_scan_axon: 8.61e-9
          axon_out:
            - name: neuroscale_out
              attributes:
                energy_message_out: 5.5e-10
                # latency_message_out: 1.8e-09
                latency_message_out: 3.0e-9

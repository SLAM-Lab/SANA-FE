# NeuroScale arch from Yale
architecture:
  name: neuroscale_chip
  attributes:
    topology: mesh
    width: 4
    height: 4
    link_buffer_size: 16
    sync_model: fixed
    # latency_sync: 2.6e-05
    # latency_sync: 1.4e-5  # stale: calibrated against an older design
    # Measured on an idle chip (no input axons yet): a step takes 1.77 us, which is
    #  this sync cost plus 50 neurons x 7.6 ns of neuron updates
    latency_sync: 1.39e-6
    # latency_sync: 0.0
    sync_protocol: neuroscale
    max_steps_async: 6  # TIME_ADVANCE: 7, TIME_HISTORY: 8
  tile:
    - name: neuroscale_tile[0..15]
      attributes:
        energy_north_hop: 1.2e-05
        latency_north_hop: 0.0e-10
        # latency_north_hop: 5.0e-10
        # latency_north_hop: 2.0e-8
        energy_east_hop: 1.2e-05
        latency_east_hop: 0.0e-10
        # latency_east_hop: 5.0e-10
        # latency_east_hop: 2.0e-8
        energy_south_hop: 1.2e-05
        latency_south_hop: 0.0e-10
        # latency_south_hop: 5.0e-10
        # latency_south_hop: 2.0e-8
        energy_west_hop: 1.2e-05
        latency_west_hop: 0.0e-10
        # latency_west_hop: 5.0e-10
        # latency_west_hop: 2.0e-8
      core:
        - name: neuroscale_core[0..3]
          attributes:
            buffer_position: synapse
            buffer_inside_unit: false
            max_neurons_supported: 200
          axon_in:
            - name: neuroscale_in
              attributes:
                energy_message_in: 1.1e-07
                latency_message_in: 1.12e-08
          soma:
            - name: neuroscale_lif
              attributes:
                model: neuroscale
                energy_access_neuron: 4.5e-10
                latency_access_neuron: 7.6e-9
                energy_update_neuron: 0.0
                latency_update_neuron: 0.0
                energy_spike_out: 7.0e-10
                latency_spike_out: 0.0e-9
            - name: neuroscale_inputs[0..1023]
              attributes:
                model: input
                energy_access_neuron: 0.0
                latency_access_neuron: 0.0
                energy_update_neuron: 0.0
                latency_update_neuron: 0.0
                energy_spike_out: 0.0
                latency_spike_out: 0.0
          dendrite:
            - name: neuroscale_dendrites
              attributes:
                model: accumulator
                energy_update: 0.0
                latency_update: 0.0
            # - name: neuroscale_dendrites_delay
            #   attributes:
            #     model: accumulator_with_delay
            #     energy_update: 0.0
            #     latency_update: 0.0
          synapse:
            - name: neuroscale_synapses
              attributes:
                model: neuroscale_synapse
                energy_read_synapse: 1.2e-09
                energy_scan_axon: 0.0e-9
                # 4.72 ns per synapse (RTL, fitted exactly) plus the 2.16 ns table
                #  read of each spiking axon's synapse-list header, spread over the
                #  ~3.97 synapses per spiking axon in this network (2.16 / 3.97 =
                #  0.54 ns). The header read is not modeled as its own cost.
                latency_read_synapse: 5.26e-09
                # Measured from the current RTL (syn.act). Once a core has seen an
                #  input axon, every step it scans every axon twice, whether or not
                #  that axon spiked: 4.41 ns/axon in the accumulate step plus
                #  4.23 ns/axon in the learning step (bit-vector clear). The old
                #  3.8 ns value only covered one of the two loops.
                latency_scan_axon: 8.64e-9
          axon_out:
            - name: neuroscale_out
              attributes:
                energy_message_out: 5.5e-10
                # latency_message_out: 1.8e-09
                latency_message_out: 3.0e-9

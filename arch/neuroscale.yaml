# NeuroScale arch from Yale
architecture:
  name: neuroscale_chip
  attributes:
    topology: mesh
    width: 4
    height: 4
    link_buffer_size: 16
    sync_model: table
    latency_sync: 1
    sync_protocol: neuroscale
    max_steps_async: 6
  tile:
    - name: neuroscale_tile[0..31]
      attributes:
        energy_north_hop: 1
        # latency_north_hop: 5.0e-10
        latency_north_hop: 1
        energy_east_hop: 1.2e-05
        # latency_east_hop: 5.0e-10
        latency_east_hop: 1
        energy_south_hop: 1.2e-05
        # latency_south_hop: 5.0e-10
        latency_south_hop: 1
        energy_west_hop: 1.2e-05
        # latency_west_hop: 5.0e-10
        latency_west_hop: 1
      core:
        - name: neuroscale_core[0..3]
          attributes:
            buffer_position: soma
            buffer_inside_unit: false
            max_neurons_supported: 200
          axon_in:
            - name: neuroscale_in
              attributes:
                energy_message_in: 1.1e-07
                latency_message_in: 1
          soma:
            - name: neuroscale_lif
              attributes:
                model: neuroscale
                energy_access_neuron: 4.5e-10
                latency_access_neuron: 2
                energy_update_neuron: 0.0e-10
                latency_update_neuron: 0
                energy_spike_out: 7.0e-10
                latency_spike_out: 1
            - name: neuroscale_inputs[0..1023]
              attributes:
                model: input
                energy_access_neuron: 0.0
                latency_access_neuron: 0.0
                energy_update_neuron: 0.0
                latency_update_neuron: 0.0
                energy_spike_out: 0.0
                latency_spike_out: 0.0
          dendrite:
            - name: neuroscale_dendrites
              attributes:
                model: accumulator
                energy_update: 0.0
                latency_update: 0
            - name: neuroscale_dendrites_delay
              attributes:
                model: accumulator_with_delay
                energy_update: 0.0
                latency_update: 0
          synapse:
            - name: neuroscale_synapse  # Use the name to link
              attributes:
                energy_process_spike: 1.2e-09
                model: current_based
                # latency_process_spike: 6.7e-08
                latency_process_spike: 1
          axon_out:
            - name: neuroscale_out
              attributes:
                energy_message_out: 5.5e-10
                latency_message_out: 1
